# Postgres for `npm run db:load`. The app itself does not need it.
# Set PGPASS in .env (or the shell) first: docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${PGPASS:?Set PGPASS in .env or the shell}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
